<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Logistics Live Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Vazirmatn:wght@400;500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>html,body{margin:0;background:#EEF1F5}@media (prefers-color-scheme: dark){html,body{background:#0E131D}}body{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}</style>
<style>#lg{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#141C2E; --muted:#58637A; --line:#D3DAE4;
  --accent:#B3262D; --accent-ink:#FFFFFF; --accent-soft:#F6E3E3; --good:#1C7A4B; --good-soft:#DDF1E6;
  --k1:#C8333A; --k2:#2457B8; --k3:#B07A00; --k4:#2A8550;
  --display:"Gloock", Georgia, "Times New Roman", serif; --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; border-radius:14px;
  padding-block:18px 28px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  max-width:980px; margin:0 auto; text-align:left; -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){ #lg{
  --bg:#0E131D; --surface:#171E2B; --sunk:#1F2837; --ink:#E7EBF2; --muted:#9BA6BA; --line:#2C3647;
  --accent:#EE5A60; --accent-ink:#1A0B0C; --accent-soft:#3A1E22; --good:#4CC88A; --good-soft:#163526;
  --k1:#D9454B; --k2:#3B6FD6; --k3:#C08A10; --k4:#2F9A5C; color-scheme:dark } }
#lg *, #lg *::before, #lg *::after{box-sizing:border-box}
#lg [hidden]{display:none!important}
#lg h1,#lg h2,#lg h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;color:var(--ink);text-wrap:balance;letter-spacing:0;text-transform:none}
#lg h1{font-size:clamp(1.8rem,5vw,2.6rem)} #lg h2{font-size:clamp(1.4rem,4vw,1.9rem)} #lg h3{font-size:1.2rem}
#lg p{margin:0}
#lg button{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--body)}
#lg input,#lg select{all:unset;border:1px solid var(--line)!important;box-sizing:border-box;font-family:var(--body);font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
#lg select{appearance:auto;-webkit-appearance:menulist}
#lg :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#lg .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#lg .top b{font-family:var(--display);font-weight:400;font-size:1.25rem;white-space:nowrap}
@media (max-width:420px){#lg .top .sub{display:none}}
#lg .top .sub{margin-left:auto;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#lg .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
#lg .stack{display:flex;flex-direction:column;gap:14px}
#lg .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#lg .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
#lg .center{align-items:center;text-align:center}
#lg .muted{color:var(--muted)}
#lg .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#lg .field{display:flex;flex-direction:column;gap:5px}
#lg .field label{font-weight:700;font-size:.9rem}
#lg .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)!important;background:var(--surface)!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;border-radius:8px;padding:10px 16px;font-weight:700;font-size:.98rem}
#lg .btn.primary{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
#lg .btn.ghost{background:transparent!important}
#lg .btn[disabled]{opacity:.45;cursor:not-allowed}
#lg .chip{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:700}
#lg .bigcode{font-family:var(--mono);font-weight:700;font-size:clamp(3rem,13vw,5.5rem);letter-spacing:.18em;line-height:1;padding:10px 18px;border:3px dashed var(--line);border-radius:14px;text-transform:uppercase}
#lg .joinbox{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
#lg .qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
#lg .qr svg{width:150px;height:150px}
#lg .url{font-family:var(--mono);font-size:.82rem;word-break:break-all;background:var(--sunk);padding:6px 10px;border-radius:6px}
#lg .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
#lg .mono{font-family:var(--mono);font-size:.8rem}
#lg .score{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
#lg .timer{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
#lg .timer i{display:block;height:100%;background:var(--accent);width:100%}
#lg .qtext{font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:700;line-height:1.4}
#lg .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){#lg .kgrid{grid-template-columns:1fr}}
#lg .kbtn{border-radius:10px;padding:16px 14px;color:#fff!important;border:0!important;text-transform:none!important;letter-spacing:0!important;font-weight:700;display:flex;gap:10px;align-items:center;min-height:70px;font-size:1.02rem;line-height:1.3}
#lg .kbtn.k0{background:var(--k1)!important}#lg .kbtn.k1{background:var(--k2)!important}#lg .kbtn.k2{background:var(--k3)!important}#lg .kbtn.k3{background:var(--k4)!important}
#lg .kbtn svg{width:22px;height:22px;flex:none;fill:#fff}
#lg .kbtn.dim{opacity:.35} #lg .kbtn.win{outline:4px solid var(--good);outline-offset:2px;opacity:1}
#lg .dist{display:flex;flex-direction:column;gap:6px}
#lg .drow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(60px,30%) 2em;gap:8px;align-items:center}
#lg .drow.dim{opacity:.5} #lg .drow.win .dlab{font-weight:800}
#lg .dsh{width:30px;height:30px;border-radius:6px;display:grid;place-items:center} #lg .dsh svg{width:16px;height:16px;fill:#fff}
#lg .dbar{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden} #lg .dbar i{display:block;height:100%;border-radius:99px;transition:width .6s}
#lg .why{background:var(--good-soft);border-radius:10px;padding:12px 14px}
#lg .board{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;width:100%;max-width:520px}
#lg .board li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);margin:0}
#lg .board li.me{outline:2px solid var(--accent)}
#lg .board .rk{font-family:var(--mono);color:var(--muted)} #lg .board .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #lg .board .pt{font-weight:700;font-variant-numeric:tabular-nums}
#lg .podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0}
#lg .pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(28vw,140px);animation:lgrise .6s ease-out both}
#lg .pod .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #lg .pod .pt{color:var(--muted);font-variant-numeric:tabular-nums}
#lg .pod .block{width:100%;border-radius:8px 8px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:#fff}
#lg .pod.p1 .block{height:130px;background:var(--k3)} #lg .pod.p2 .block{height:95px;background:var(--k2)} #lg .pod.p3 .block{height:70px;background:var(--k1)}
#lg .result{font-family:var(--display);font-size:clamp(1.8rem,7vw,2.6rem);padding:14px 22px;border-radius:12px;animation:lgpop .45s}
#lg .result.good{background:var(--good-soft);color:var(--good)} #lg .result.bad{background:var(--accent-soft);color:var(--accent)}
#lg .note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.92rem}
#lg .err{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.92rem}
#lg .players{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#lg .chip.off{opacity:.45;text-decoration:line-through}
@keyframes lgrise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lgpop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#lg *{animation:none!important;transition:none!important}}
/* settings controls */
#lg .chip[aria-pressed="true"]{background:var(--ink)!important;color:var(--surface)!important;border-color:var(--ink)!important}
#lg .chip{cursor:pointer;background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;text-transform:none!important;letter-spacing:0!important}
#lg .numfield{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;color:var(--muted)}
#lg .numfield input{width:5.5em;border-radius:999px;padding:6px 10px;font-weight:600}
#lg .switch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line)!important;background:var(--bg)!important;color:var(--ink)!important;border-radius:10px;padding:10px 12px;text-transform:none!important;letter-spacing:0!important}
#lg .switch i{flex:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;margin-top:2px;transition:background .2s}
#lg .switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .2s}
#lg .switch[aria-checked="true"] i{background:var(--good)}
#lg .switch[aria-checked="true"] i::after{left:19px}
#lg .switch span{display:flex;flex-direction:column;gap:2px}
#lg .switch small{color:var(--muted);font-size:.84rem;line-height:1.4}
/* language */
#lg .langsw{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap;justify-content:flex-end}
#lg .lchip{border:1px solid var(--line)!important;background:var(--surface)!important;color:var(--ink)!important;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;text-transform:none!important;letter-spacing:0!important}
#lg .lchip[lang="fa"]{font-family:"Vazirmatn",Tahoma,sans-serif}
#lg .lchip[aria-pressed="true"]{background:var(--ink)!important;color:var(--surface)!important;border-color:var(--ink)!important}
#lg .fa,#lg .fa-inline{font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;direction:rtl;unicode-bidi:isolate}
#lg .fa{display:block;text-align:right;font-size:.92em;font-weight:500;color:var(--muted);margin-top:4px;line-height:1.7}
#lg .fa-main{font-size:1em;color:inherit;font-weight:700;margin-top:0}
#lg .en-sub{display:block;font-size:.78em;font-weight:500;opacity:.75;margin-top:4px}
#lg .fa-inline{display:inline-block}
#lg .ktext{display:flex;flex-direction:column;flex:1;min-width:0}
#lg .kbtn .fa,#lg .kbtn .en-sub{color:#fff;opacity:.92}
#lg .kbtn .fa-main{opacity:1}
#lg .dlab{display:flex;flex-direction:column;min-width:0}
#lg .why .fa{color:var(--ink)}
@media (max-width:560px){#lg .top{flex-wrap:wrap}#lg .langsw{margin-left:0;width:100%;justify-content:flex-start}}

#lg .result .gain{display:block;font-family:var(--mono);font-size:.55em;margin-top:4px}
#lg .result .fa-inline{font-family:"Vazirmatn",Tahoma,sans-serif;font-weight:700}

#lg .lat{font-family:var(--mono);font-size:.75rem;text-align:center;color:var(--muted);margin-top:4px}
#lg .lat-good{color:var(--good)} #lg .lat-ok{color:var(--k3)} #lg .lat-bad{color:var(--accent)}
#lg .chip small{font-family:var(--mono);font-size:.72rem;margin-left:4px}
</style><style>#lg#lg{--accent:#C2410C;--accent-soft:#FCE7D9}@media (prefers-color-scheme: dark){#lg#lg{--accent:#FB8A3C;--accent-soft:#3A2414}}</style></head>
<body><div id="lg"><div class="top"><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2l4 3 5-1 2 5 5 2-1 5 3 4-3 4 1 5-5 2-2 5-5-1-4 3-4-3-5 1-2-5-5-2 1-5-3-4 3-4-1-5 5-2 2-5 5 1z" fill="var(--accent)"/><text x="20" y="25" text-anchor="middle" font-family="Gloock, Georgia, serif" font-size="14" fill="var(--accent-ink)">&#167;</text></svg><b>Study Lab</b><span class="sub">Site Logistics game</span><div class="langsw"></div></div><div class="lg-main"><p>Loading the game…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>(function(){
// ===== LAWS-1030 content bank (from the Consideration + Capacity test review) =====
const TOPICS = {
  basics:  {name:"Contract basics", code:"1"},
  consid:  {name:"Consideration", code:"A1–A7"},
  seal:    {name:"Seal & click", code:"A8–A9"},
  tender:  {name:"Tenders", code:"A10"},
  qm:      {name:"Quantum meruit", code:"A11"},
  debt:    {name:"Paying less", code:"A12"},
  estop:   {name:"Promissory estoppel", code:"A13"},
  minors:  {name:"Minors", code:"B2–B6"},
  parents: {name:"Parents", code:"B7"},
  capacity:{name:"Other capacity", code:"B1, B8–B15"},
  illegal: {name:"Illegal contracts", code:"C"}
};
const Q = [];
const mc = (id,t,q,o,a,why,src="var") => Q.push({id,t,type:"mc",q,o,a,why,src});
const tf = (id,t,q,a,why,src="var") => Q.push({id,t,type:"tf",q,o:["True","False"],a:a?0:1,why,src});
const ms = (id,t,q,o,a,why,src="var") => Q.push({id,t,type:"multi",q,o,a,why,src});
const fb = (id,t,q,b,why,src="var",anyOrder=false) => Q.push({id,t,type:"fill",q,b,why,src,anyOrder});
// ---- Practice quiz (Q1–55) and class Kahoot (Q56–59) ----
ms("p1","consid","Consideration, as a required contract element, can be: (choose all)",["Friendship","An inheritance","Money","A service"],[2,3],"A trade needs value. Friendship isn't traded, and an inheritance is a gift.","quiz");
fb("p2","consid","A court may look at the adequacy of consideration if it believes ___ or ___ influence occurred.",[["fraud"],["undue"]],"Normally courts don't check fairness (caveat emptor), except when someone lied or used too much pressure.","quiz");
fb("p3","seal","A contract under seal derives its ___ from its ___.",[["validity"],["form"]],"Signature + seal = \"I really mean it.\"","quiz");
fb("p4","seal","It is still unsettled whether a click equals a ___ or a ___ as binding consideration.",[["peppercorn"],["seal"]],"The courts haven't decided yet.","quiz",true);
mc("p5","seal","Which is FALSE about a click as consideration?",["A click will be sufficient consideration in the case of online contests.","Courts have not decided whether a click is like a peppercorn or a seal.","A click has less \"gravity\" than a seal.","Websites give prizes for clicks because you see their ads."],0,"\"Will\" is too strong. Nobody knows yet.","quiz");
mc("p6","seal","Which is FALSE about a contract under seal?",["Courts today will look to see if consideration exists with contracts under seal.","A seal shows intent, even for a gratuitous promise.","A contract under seal gets its validity from its form.","A corporate seal works as the company's signature."],0,"With a seal, courts don't look for consideration.","quiz");
mc("p7","consid","Joan taught Bobby basketball. Years later he promised her $500,000. What is true?",["Joan's past work is not consideration to enforce Bobby's promise.","Bobby must pay because Joan's teaching had real value.","Bobby must pay because the promise came after the work.","Joan can claim quantum meruit for the $500,000."],0,"Past consideration = no consideration. It was a gift.","quiz");
fb("p8","consid","Johan washed Bill's car every Saturday without being asked, then asked for $100. He loses because there was no ___ exchange.",[["bargained for","bargained","bargain"]],"Bargain first, work second.","quiz");
fb("p9","consid","Work provided in the ___ does not make ___ in the present.",[["past"],["consideration"]],"Present ✓  Future ✓  Past ✗","quiz");
fb("p10","illegal","A contract that contains consideration involving an illegal act is ___.",[["unenforceable"]],"The court won't help with an illegal trade.","quiz");
mc("p11","illegal","Which is FALSE about the legality of consideration?",["If you didn't know the consideration contained an illegal act, the contract would still be enforceable.","Illegal consideration makes a contract unenforceable.","Not knowing the law is no excuse.","An exchange must be legal before it is considered valuable."],0,"Not knowing the law is no excuse.","quiz");
mc("p12","illegal","Leslie \"sold\" Tom her house for $5,000, but she lied: she didn't own it. The court is likely to:",["Not enforce the contract","Enforce it at $5,000","Set a fair price using quantum meruit","Make Leslie sell Tom a different house"],0,"Fraud. And the court won't make a new deal for people.","quiz");
fb("p13","tender","A tender differs from the ___ offer in the formation of a legal relationship.",[["ordinary"]],"A tender usually can't be taken back.","quiz");
mc("p14","tender","BuildersRUs sent a tender under seal with a deposit, won, then couldn't do the job. What is true?",["BuildersRUs would have to perform.","BuildersRUs can withdraw, because nothing was signed yet.","BuildersRUs can withdraw and get its deposit back.","The owner must give the job to the next-lowest bidder at the same price."],0,"Irrevocable. If they refuse, they lose the deposit and can be sued.","quiz");
ms("p15","qm","What do courts consider to set a quantum meruit price? (choose all)",["The price of the goods or services in the area","The \"going rate\" of similar suppliers","Only the price agreed before the work","Whatever this person charged before"],[0,1],"Not \"only the price agreed before,\" and not \"whatever this person charged before.\"","quiz");
mc("p16","qm","A quasi-contractual remedy that sets a reasonable price when no price was set is called:",["Quantum meruit","Promissory estoppel","Caveat emptor","Ultra vires"],0,"\"As much as is deserved.\"","quiz");
mc("p17","debt","Which is NOT a way courts lessen the impact of a lack of consideration when a debtor pays less than they owe?",["A written document in which the parties include a promise to take a lesser sum","A document under seal promising to take a lesser sum","Paying with something other than money","Paying the smaller amount before the due date"],0,"Writing alone is not enough. It needs a SEAL.","quiz");
fb("p18","debt","If a creditor agrees to accept a lesser sum, his promise is ___ and ___.",[["gratuitous"],["unenforceable"]],"The creditor got nothing back.","quiz");
fb("p19","estop","Under promissory ___, a promise can be enforced even without ___.",[["estoppel"],["legal consideration","consideration"]],"Promised + trusted + acted = can't take it back.","quiz");
mc("p20","estop","Phil promised Gloria a full-time job. She quit her job and made a car down payment. Then Phil changed his mind. What are Gloria's options?",["The best way to enforce Phil's promise is to assert promissory estoppel.","Phil's promise is always unenforceable because it wasn't in writing.","Gloria can claim quantum meruit for the job she lost.","Gloria has no options: she gave no consideration."],0,"Not \"always unenforceable because it wasn't written.\" Strong word!","quiz");
ms("p21","minors","Why should minors not be bound by their promises? (choose all)",["Inexperience","Immaturity","Public policy","Parents can be responsible"],[0,1,2],"\"Parents can be responsible\" is not a reason.","quiz");
fb("p22","minors","The law attempts to protect the best interests of a minor as a matter of ___.",[["equity"]],"Equity = fairness.","quiz");
fb("p23","minors","In Common Law, persons under the age of 21 are called ___ or ___.",[["infants"],["minors"]],"\"Infant\" in law does not mean a baby.","quiz",true);
fb("p24","minors","___ may enter into only ___ contracts.",[["minors","infants"],["voidable"]],"Only the minor can choose to cancel.","quiz");
mc("p25","minors","Which is a correct statement about minors and contracts?",["Minors may enter into only voidable contracts.","Minors may enter into only void contracts.","Contracts with minors are fully enforceable against them.","Minors cannot make contracts at all."],0,"Not void, not fully enforceable, and minors CAN make contracts.","quiz");
fb("p26","minors","If a contract with a minor for a non-necessary has not been fully ___, it may be ___ at the minor's option.",[["performed"],["voidable"]],"Deal not finished + kid + \"want\" item = the kid can cancel.","quiz");
fb("p27","minors","A minor can get out of a contract that is not fully performed, or is for non-necessaries, by ___ it.",[["repudiating","disaffirming","repudiate"]],"Same idea as disaffirming. Do it within a reasonable time.","quiz");
fb("p28","minors","At the age of majority, a person may ratify, or ___, contracts made as a minor.",[["agree to perform"]],"Ratify = keep the deal. (Disaffirm = the opposite.)","quiz");
fb("p29","minors","Once a person reaches the age of ___, she may ratify contracts made as a(n) ___.",[["majority"],["minor","infant"]],"18 in Ontario.","quiz");
fb("p30","minors","A minor can ___ a contract for a necessary, but is still liable for its ___.",[["disaffirm","repudiate"],["reasonable value"]],"The kid can cancel, but still pays a fair price.","quiz");
mc("p31","minors","Which is NOT usually a necessary?",["A vacation","Clothing","Basic medical services","Shelter"],0,"Need vs. want.","quiz");
mc("p32","minors","Betty sells Jane (a minor) a vase. When could the contract be voidable?",["Jane returns the vase when she finds out it's sold more cheaply everywhere else.","Betty cancels because another buyer offered more.","Jane stops making payments but keeps the vase.","Jane smashes the vase and asks for all her money back."],0,"Only the minor cancels, by giving the item back in good condition.","quiz");
mc("p33","minors","Jim (16) bought a vase: 50% down + $10 a month for 6 months. Which is FALSE?",["Jim can return the vase for any reason and get back what he already paid, even if it's now cracked.","Jim can repudiate within a reasonable time.","Only Jim, not the seller, can cancel the deal.","Not paying the $10 a month is not the same as cancelling."],0,"Damaged item = no full refund.","quiz");
ms("p34","minors","Fraudulent misrepresentation of age: which are correct? (choose all)",["A minor cannot be bound by a contract for non-necessary goods or services","Online transactions further complicate things","A minor who tries to take advantage of merchants can face criminal charges","Different rules apply to online purchases","A minor who lies about age doesn't have to pay for necessaries"],[0,1,2],"The rules are the SAME online. Minors are still liable for necessaries.","quiz");
fb("p35","minors","The law sees little difference in treating a minor as a ___ or a ___.",[["merchant","seller"],["customer","buyer"]],"Selling or buying, a kid is still a kid. (Order: merchant first.)","quiz");

// Turn a question into its multiple-choice form (fill-ins use the list above)
function asMC(q){
  if (q.type !== "fill") return q;
  const o = MCD[q.id] || [q.b.map(a=>a[0]).join(", "), "none of these"];
  return {...q, type:"mc", o, a:0, q:q.q.replace(/___/g,"_____")};
}

{"id":"sl-stakeholders-4","t":"sl3","type":"mc","q":"The Profile Analysis Meeting is usually:","o":["The project Start-Up Meeting, organized by the PM","The final closeout meeting","A union certification vote","The tender opening"],"a":0,"why":"At the Start-Up Meeting, the PM/Super profiles each key stakeholder and records it in the register.","src":"lesson"},
{"id":"sl-stakeholders-5","t":"sl3","type":"mc","q":"On a power/interest grid, which stakeholders get most of your time?","o":["High power, high interest","Low power, low interest","High interest, low power","Whoever calls most often"],"a":0,"why":"High/high stakeholders are managed closely; low/low are monitored with minimal effort.","src":"lesson"},
{"id":"sl-stakeholders-6","t":"sl3","type":"mc","q":"What is the main goal of a Stakeholder Analysis / Success Criteria document?","o":["To build or strengthen the relationship with the client","To calculate the project contingency","To certify a union","To replace the stakeholder register"],"a":0,"why":"It digs into the client's culture and history to find ways to strengthen the relationship.","src":"lesson"},
{"id":"sl-unions-1","t":"sl4","type":"mc","q":"A non-union employer is legally required to provide:","o":["EI, CPP and vacation pay as legislated","Dental and health benefits","A pension plan","Union-scale wages"],"a":0,"why":"Anything beyond the legislated minimum is optional for a non-union employer.","src":"lesson"},
{"id":"sl-unions-2","t":"sl4","type":"mc","q":"A union local is:","o":["A regional subdivision of a parent union that represents workers in its territory","A single construction site's crew","A non-union labour broker","A government labour board"],"a":0,"why":"Parent unions are too big for one entity, so they're divided into territorial locals.","src":"lesson"},
{"id":"sl-unions-3","t":"sl4","type":"mc","q":"A carpenter in London, Ontario belongs to which local?","o":["Local 1946","Local 27","Local 450","Local 183"],"a":0,"why":"London = Local 1946. Toronto = Local 27. Both are part of the United Brotherhood of Carpenters and Joiners of America.","src":"lesson"},
{"id":"sl-unions-4","t":"sl4","type":"mc","q":"When a union files a formal complaint against a contractor for giving its claimed work to another trade, it's called a:","o":["Grievance","Certification","Lockout","Project agreement"],"a":0,"why":"Jurisdictional disputes lead to grievances, which can stop work and lead to legal action.","src":"lesson"},
{"id":"sl-unions-5","t":"sl4","type":"mc","q":"Union members choose their leadership by:","o":["Nominating and voting for them","The employer appointing them","Seniority alone","The OLRB assigning them"],"a":0,"why":"All members nominate and vote for leaders who represent them to the employer.","src":"lesson"},
{"id":"sl-unions-6","t":"sl4","type":"mc","q":"In the professor's head wall story, who won the right to fasten medical head walls to the studs?","o":["The drywallers","The plumbers","The electricians","The labourers"],"a":0,"why":"Drywall screws into metal studs = drywall work. The dispute stopped the project for a couple of days.","src":"lesson"},
{"id":"sl-unions-7","t":"sl4","type":"mc","q":"What's one big advantage of working with a large union, according to the lecture?","o":["A large pool of fairly skilled workers you can staff a job with quickly","Lower wages than non-union labour","No limits on hours or overtime","No collective agreement to follow"],"a":0,"why":"Call the union hall and you can often get 100 carpenters (or 900 electricians) within days.","src":"lesson"},
{"id":"sl-unions-8","t":"sl4","type":"mc","q":"What level of employee support does a union need for OLRB certification?","o":["55%","40%","50% plus one","66%"],"a":0,"why":"At least 55% of the designated group, on the day the application is filed.","src":"lesson"},
{"id":"sl-unions-9","t":"sl4","type":"mc","q":"Which employees count toward the certification threshold?","o":["Only those at work on the filing day, doing work covered by the application","Every employee the company has ever had","Only apprentices","Only employees with 5+ years of seniority"],"a":0,"why":"The count is taken from employees working that day in the covered work.","src":"lesson"},
{"id":"sl-unions-10","t":"sl4","type":"mc","q":"If the OLRB finds an employer used threats or intimidation during a union drive, it can:","o":["Certify the union automatically, even with no cards signed","Fine the union","Ban the union for 5 years","Do nothing; intimidation isn't regulated"],"a":0,"why":"Automatic certification is the OLRB's remedy for employer intimidation.","src":"lesson"},
{"id":"sl-unions-11","t":"sl4","type":"mc","q":"Collective agreements typically last:","o":["2–4 years","6 months","10 years","For the life of the company"],"a":0,"why":"2–4 years, with labour disruptions common during renegotiation.","src":"lesson"},
{"id":"sl-unions-12","t":"sl4","type":"mc","q":"Can an owner close a unionized company and start a new one to get rid of the union?","o":["No; the union affiliation generally follows them","Yes, certification ends with the old company","Yes, if they wait 30 days","Only with OLRB approval"],"a":0,"why":"Certification dies with the company, but owners can't use that to escape it.","src":"lesson"},
{"id":"sl-unions-13","t":"sl4","type":"mc","q":"If a contractor never self-performs a particular trade:","o":["It theoretically can't become signatory to that trade's union","It must sign with that union anyway","It can't hire subcontractors for that trade","Its workers automatically join CLAC"],"a":0,"why":"You can't be certified for workers you don't employ.","src":"lesson"},
{"id":"sl-unions-14","t":"sl4","type":"mc","q":"A GC becomes signatory to the plumbers' union. What happens to its plumbing subcontracts?","o":["It must use unionized plumbing subs on its jobs from then on","Nothing changes; subs are unaffected","It can only use CLAC plumbers","It must stop doing plumbing work entirely"],"a":0,"why":"That's why big GCs stopped self-performing: staying non-signatory keeps them free to tender to anyone.","src":"lesson"},
{"id":"sl-unions-15","t":"sl4","type":"mc","q":"What's the difference between a strike and a lockout?","o":["Workers start a strike; the employer starts a lockout","They mean the same thing","A lockout is started by the union","A strike only happens on non-union sites"],"a":0,"why":"Both happen when collective agreement talks fail. Plan schedule contingency if an agreement is up for renewal during your job.","src":"lesson"},
{"id":"sl-unions-16","t":"sl4","type":"mc","q":"Why should non-union employers be careful about who works on a Saturday cleanup?","o":["55% of just the few workers on site that day could certify the whole company","Saturday work is illegal in Ontario","The OLRB doubles the threshold on weekends","Union members can't work weekends"],"a":0,"why":"Only employees at work on the filing day count, so a tiny crew can tip the vote.","src":"lesson"},
{"id":"sl-unions-17","t":"sl4","type":"mc","q":"A Merit Open Shop Contractor:","o":["Is signatory to no union and can hire both union and non-union companies","Is signatory to every union","Can only hire non-union workers","Is a type of labour broker"],"a":0,"why":"Flexibility is the point: no union ties, but free to hire union subs.","src":"lesson"},
{"id":"sl-unions-18","t":"sl4","type":"mc","q":"How does CLAC differ from traditional construction unions?","o":["It focuses on cooperation, strikes only as a last resort, and doesn't force membership","It is an American union with 450 locals","It requires seniority-based hiring","It prohibits members from working outside their local"],"a":0,"why":"CLAC is all-Canadian and cooperative rather than confrontational.","src":"lesson"},
{"id":"sl-unions-19","t":"sl4","type":"mc","q":"An Alberta Project Agreement is:","o":["A per-project collective agreement where strikes and lockouts are prohibited for the project","A permit to start construction","A contract between the owner and architect","A national union certification"],"a":0,"why":"New in 2020: a special collective agreement for one specific project.","src":"lesson"},
{"id":"sl-unions-20","t":"sl4","type":"mc","q":"Labour brokers in Western Canada are used to:","o":["Hire site labour at arm's length so the GC avoids becoming unionized","Negotiate collective agreements for unions","Certify unions with the labour board","Train apprentices"],"a":0,"why":"They're an arm's-length hiring channel to avoid certification.","src":"lesson"},
{"id":"sl-unions-21","t":"sl4","type":"mc","q":"Why do union rules matter when planning a site?","o":["They affect amenities, tools, hours and pay, which change duration and worker numbers on site","They don't; site planning is only about cranes and hoarding","They decide the building's design","They set the municipal permit fees"],"a":0,"why":"Labour terms drive amenities, hours and cost, and so the schedule and crew sizes.","src":"lesson"},
{"id":"sl-unions-22","t":"sl4","type":"mc","q":"What did the professor recommend when planning site amenities?","o":["Plan every site as if union labour will be on it","Plan for the legal minimum to save money","Only plan amenities for union sites","Let each subcontractor plan its own amenities"],"a":0,"why":"Better treatment raises morale and output, which recovers the extra cost.","src":"lesson"},
{"id":"sl-x-1","t":"sl1","type":"mc","q":"\"Site Logistics\" is another way of saying:","o":["Construction site planning","Material purchasing","Construction accounting","Building inspection"],"a":0,"why":"The course focuses on planning the physical site to improve efficiency.","src":"extra"},
{"id":"sl-x-2","t":"sl1","type":"mc","q":"Planning is the first step of which management approach?","o":["Planning, organizing and controlling","Design, bid, build","Estimate, tender, award","Plan, do, check, act"],"a":0,"why":"Planning → organizing → controlling the execution of a project.","src":"extra"},
{"id":"sl-x-3","t":"sl1","type":"mc","q":"A good construction plan is the basis for developing:","o":["The budget and the schedule","The architectural drawings","The union agreement","The zoning bylaw"],"a":0,"why":"The plan feeds both the budget and the schedule.","src":"extra"},
{"id":"sl-x-4","t":"sl1","type":"mc","q":"Which is a planning activity of the consultant organizations?","o":["Municipal planning approvals and design calculations","Weekly Foremen's meetings","Hiring subcontractors","Paying the contractor"],"a":0,"why":"Consultants plan the design: site investigations, approvals, calculations, drawings, specs, tender documents.","src":"extra"},
{"id":"sl-x-5","t":"sl1","type":"mc","q":"The client usually plans activities with durations of:","o":["Weeks or months","Hours","Half days","Minutes"],"a":0,"why":"Client = weeks or months. Consultants and Supers = days or weeks.","src":"extra"},
{"id":"sl-x-6","t":"sl1","type":"mc","q":"A construction schedule can take the form of:","o":["A written narrative, a bar chart, or a CPM schedule","Only a CPM network","Only a Gantt chart","A stakeholder register"],"a":0,"why":"All three forms were listed in class.","src":"extra"},
{"id":"sl-x-7","t":"sl1","type":"mc","q":"What's the risk of setting contingency too high in a bid?","o":["Your price is less competitive and you may lose the bid","You will always lose money","The OLRB may certify a union","The schedule becomes invalid"],"a":0,"why":"Too high = uncompetitive. Too low = you may lose money when risks happen.","src":"extra"},
{"id":"sl-x-8","t":"sl1","type":"mc","q":"Which is a client planning activity during execution?","o":["Confirming the contractor's bonding and insurance stay current","Deciding whether to bid","Doing the quantity takeoff","Writing 2–3 week look-aheads"],"a":0,"why":"The client also monitors progress and H&S at a high level, and pays the contractor.","src":"extra"},
{"id":"sl-x-9","t":"sl2","type":"mc","q":"The term \"journeyperson\" comes from:","o":["Tradespeople travelling (journeying) to find work","Completing a journey log","Being a member of a union journey","Working on highways"],"a":0,"why":"In olden times tradespeople had to travel to find work.","src":"extra"},
{"id":"sl-x-10","t":"sl2","type":"mc","q":"A Lead Hand is:","o":["A senior, more skilled crew member who helps the Foreman manage the crew","The head of a union local","The client's representative","A first-term apprentice"],"a":0,"why":"Lead Hands sit between the Foreman and the journeypersons.","src":"extra"},
{"id":"sl-x-11","t":"sl2","type":"mc","q":"Which pair sits at the top of the management-level hierarchy, under the Operations Manager/VP?","o":["Construction Manager and General Superintendent","Project Coordinator and Field Coordinator","Foreman and Lead Hand","Scheduler and Estimator"],"a":0,"why":"The Construction Manager leads the PM side; the General Superintendent leads the Super side.","src":"extra"},
{"id":"sl-x-12","t":"sl3","type":"mc","q":"On a power/interest grid, a stakeholder with high power but low interest should be:","o":["Kept satisfied","Managed closely","Kept informed","Ignored"],"a":0,"why":"High power/low interest = keep satisfied. High/high = manage closely.","src":"extra"},
{"id":"sl-x-13","t":"sl3","type":"mc","q":"EllisDon's company motto, mentioned in class, is:","o":["\"We Build on Great Relationships\"","\"Safety First, Always\"","\"Built to Last\"","\"Failing to plan is planning to fail\""],"a":0,"why":"Used to show why stakeholder relationships matter.","src":"extra"},
{"id":"sl-x-14","t":"sl4","type":"mc","q":"A collective agreement covers all of these EXCEPT:","o":["The building's design","Wages","Hours of work","Work claimed by the union"],"a":0,"why":"It covers pay, hours, tools, travel and claimed work, not design.","src":"extra"},
{"id":"sl-x-15","t":"sl4","type":"mc","q":"Commercial carpenters in Toronto belong to:","o":["Local 27","Local 1946","CLAC","Local 450"],"a":0,"why":"Toronto = Local 27; London = Local 1946.","src":"extra"},
{"id":"sl-x-16","t":"sl4","type":"mc","q":"Which body certifies unions in Ontario?","o":["The Ontario Labour Relations Board (OLRB)","The Ministry of Transportation","The municipality","CCDC"],"a":0,"why":"Unions apply to the OLRB for certification.","src":"extra"},
{"id":"sl-x-17","t":"sl4","type":"mc","q":"Why do most big Canadian contractors stay signatory to most unions?","o":["Being signatory is hard to undo, and it lets them work with and hire unionized trades","Unions pay them to sign","It's required by OHSA","It eliminates collective agreements"],"a":0,"why":"Once certified it's almost impossible to decertify, and many owners and markets rely on union trades.","src":"extra"},
{"id":"sl-x-18","t":"sl1","type":"mc","q":"The plan and schedule are mostly responsible for:","o":["The success or failure of a construction project","The building's architectural style","Union certification","Municipal tax rates"],"a":0,"why":"Stated directly in the Class 2 slides.","src":"extra"}];
const SL_LECTURE = {"planning":"<p><strong>Large vs. small contractor (Sept 22 recording).</strong> A large company is a safety net: 10–12 experienced people weigh in, which catches problems early. But it can bog things down, and strong personalities may veto your plan because of seniority. Career growth is slower (about 15 years to reach General Super or Construction Manager) but more stable.</p>\n    <p>A small company (typical in London, ON) gives the PM or Super near-total autonomy: you may bid, run and close out the job yourself, with direct access to the CEO. The risk is that if a job goes badly, it's on you, even when it's not your fault (a tough owner, contract or consultant).</p>","phases":"<p><strong>Points from the Sept 22 recording:</strong></p>\n    <ul><li>Clients are driven by time and cost: the faster to market, the sooner they earn revenue. A late job also hurts their lenders and shareholders.</li>\n    <li>The contractor is at the mercy of the consultant team. Without complete drawings and information, you can't firm up subcontracts or order materials.</li>\n    <li>Prequalification looks at similar past work, capacity (people and teams), ability to handle the complexity, and financial strength (cash flow, working capital).</li>\n    <li>The owner's rep can make or break a project. An unreasonable one can make closeout and final sign-off painful.</li>\n    <li>Client H&amp;S monitoring means asking for site inspection reports, to show due diligence to the Ministry. Clients may also manage their own risk by holding back payment.</li>\n    <li>Contractors may decline to bid if they had a bad experience with that owner or PM before.</li>\n    <li>Contingency example: a 25% chance of steel tariffs leads to a contingency fund or exclusion language in the contract.</li>\n    <li>Re-evaluating overhead: do we really need three cranes, or ten supers? Send idle equipment (e.g., a zoom boom) back. \"No sense having equipment laying around unless it's moving.\"</li>\n    <li>Monthly reports are written mainly by the PM with the Super's input. Never lie, and bring a mitigation plan with any bad news.</li></ul>","overlap":"<p><strong>On IPD (Sept 22 recording):</strong> IPD grew out of the lawsuits and schedule claims that traditional contracts produced. Getting the trades and contractor into design early means fewer \"we can't build that\" surprises. Its downsides: contractors agree to a fixed, disclosed profit (around 3–4%) and must open their books, including supplier rebates. So IPD hasn't taken off as expected; CM, design-build, DBFM and P3s are more common. If you must share cost information, use an NDA.</p>\n    <p>His main message: plans are never static. They get made, updated, revisited and updated again, because there are always changes and curveballs.</p>","unions1":"<p><strong>From the Oct 7 recording:</strong></p>\n    <ul><li><strong>Pros of unions:</strong> a big roster of fairly skilled workers. Call the hall and you can staff a big job fast.</li>\n    <li><strong>Cons:</strong> less incentive for high performers, and rules on hours, overtime, travel time, mileage and parking make union labour more expensive.</li>\n    <li>Locals pay differently because local conditions differ (e.g., Toronto's cost of living and $30–50/day parking).</li>\n    <li><strong>The head wall dispute:</strong> plumbers, electricians and drywallers all claimed the work of screwing medical head walls into metal studs. The drywallers won, but the project stopped for a couple of days. Pre-plan who does what. A common fix is for a trade to hire its own union labourer for cleanup.</li></ul>","signatory":"<p><strong>From the Oct 7 recording:</strong></p>\n    <ul><li><strong>The Saturday trap:</strong> if you bring in 2–3 workers for a Saturday cleanup, 55% of just those workers could certify your entire company. Union organizers look for sites like that.</li>\n    <li>A union wage (e.g., $38/hr) is only part of the cost. Benefits, pension, dues and premiums can almost double it.</li>\n    <li>If you're signatory to a union (e.g., plumbers), that work must go to union subs too. That's why big GCs stopped self-performing and sub out work instead: it keeps them free to tender to anyone.</li>\n    <li>Collective agreements spell out things like a 7:00–3:30 workday, paid breaks and lunch, the tools workers bring, and per diems for working far from home.</li>\n    <li><strong>Strike</strong> = workers walk off. <strong>Lockout</strong> = the employer locks them out. Both are disruptive. If an agreement is up for renewal during your project, add contingency to the schedule.</li></ul>","alts":"<p><strong>From the Oct 7 recording:</strong></p>\n    <ul><li>Merit open shops are more nimble and take more market share, but inviting union employers onto your site can still expose you to certification.</li>\n    <li>Some companies join CLAC just to avoid the bigger unions. CLAC wages and packages are a bit lower. The professor said an emerging company might join CLAC for protection, but some government projects require a unionized employer, and CLAC doesn't always count.</li>\n    <li>The Ottawa Hospital agreement angered merit shop contractors because non-union companies couldn't bid on the job.</li></ul>","unions2":"<p><strong>From the Oct 7 recording:</strong> a non-union day may run from 6:00 or 6:30 am to 6 or 7 pm. A union day is more like 7:00–3:30 or 8:00–4:30, maybe with Fridays off. To cover 50-hour weeks on a union job you may need a second shift (e.g., Tuesday to Friday), which means more workers on site. Unions also run their own safety and skills training at low or no cost, and union sites tend to have a better safety culture.</p>"};

const FAQ = {
p1:["«عوض» (consideration)، به‌عنوان یکی از ارکان لازم قرارداد، می‌تواند این‌ها باشد: (همهٔ موارد درست را انتخاب کنید)",["دوستی","ارث","پول","یک خدمت"],"معامله باید ارزش داشته باشد. دوستی مبادله نمی‌شود و ارث یک هدیه است."],
p2:["دادگاه ممکن است «کافی بودن عوض» (adequacy) را بررسی کند، اگر معتقد باشد ___ یا ___ نفوذ (influence) رخ داده است.",null,"معمولاً دادگاه منصفانه بودن معامله را بررسی نمی‌کند (caveat emptor)، مگر اینکه کسی دروغ گفته یا فشار بیش از حد وارد کرده باشد."],
p3:["قرارداد ممهور (under seal) ___ خود را از ___ خود می‌گیرد.",null,"امضا + مهر = «من واقعاً قصدش را دارم.»"],

p5:["کدام جمله دربارهٔ «کلیک» به‌عنوان عوض نادرست (FALSE) است؟",["یک کلیک برای مسابقه‌های آنلاین حتماً (will) عوض کافی خواهد بود.","دادگاه‌ها هنوز تصمیم نگرفته‌اند که کلیک مانند دانهٔ فلفل (peppercorn) است یا مُهر (seal).","کلیک «وزن» کمتری از مُهر دارد.","وب‌سایت‌ها برای کلیک جایزه می‌دهند چون شما تبلیغاتشان را می‌بینید."],"کلمهٔ «will» (حتماً) بیش از حد قطعی است. هیچ‌کس هنوز نمی‌داند."],
p6:["کدام جمله دربارهٔ قرارداد ممهور (under seal) نادرست است؟",["دادگاه‌های امروز بررسی می‌کنند که آیا در قراردادهای ممهور عوض وجود دارد یا نه.","مُهر نشان‌دهندهٔ قصد است، حتی برای یک وعدهٔ بلاعوض (gratuitous promise).","قرارداد ممهور اعتبار خود را از شکل (form) خود می‌گیرد.","مُهر شرکت (corporate seal) مانند امضای شرکت عمل می‌کند."],"وقتی مُهر وجود دارد، دادگاه دنبال عوض نمی‌گردد."],
p7:["جوآن به بابی بسکتبال یاد داد. سال‌ها بعد بابی به او قول ۵۰۰٬۰۰۰ دلار داد. کدام درست است؟",["کارِ گذشتهٔ جوآن عوض محسوب نمی‌شود تا وعدهٔ بابی قابل اجرا باشد.","بابی باید بپردازد چون آموزش جوآن ارزش واقعی داشت.","بابی باید بپردازد چون وعده بعد از کار داده شد.","جوآن می‌تواند ۵۰۰٬۰۰۰ دلار را بر اساس quantum meruit مطالبه کند."],"عوض گذشته (past consideration) = بدون عوض. این یک هدیه بود."],
p8:["یوهان هر شنبه بدون اینکه کسی از او بخواهد ماشین بیل را شست و بعد ۱۰۰ دلار خواست. او می‌بازد چون هیچ مبادلهٔ ___ وجود نداشت.",null,"اول توافق، بعد کار."],
p9:["کاری که در ___ انجام شده، در زمان حال ___ ایجاد نمی‌کند.",null,"حال ✓ آینده ✓ گذشته ✗"],
p10:["قراردادی که عوض آن شامل یک عمل غیرقانونی است، ___ است.",null,"دادگاه به یک معاملهٔ غیرقانونی کمک نمی‌کند."],
p11:["کدام جمله دربارهٔ قانونی بودن عوض نادرست است؟",["اگر نمی‌دانستید که عوض شامل یک عمل غیرقانونی است، قرارداد همچنان قابل اجرا بود.","عوض غیرقانونی، قرارداد را غیرقابل اجرا (unenforceable) می‌کند.","ندانستن قانون عذر نیست.","یک مبادله باید قانونی باشد تا «باارزش» محسوب شود."],"ندانستن قانون عذر نیست."],
p12:["لزلی خانه‌اش را به ۵٬۰۰۰ دلار به تام «فروخت»، اما دروغ گفت: خانه مال او نبود. دادگاه احتمالاً:",["قرارداد را اجرا نمی‌کند","آن را با ۵٬۰۰۰ دلار اجرا می‌کند","با quantum meruit یک قیمت منصفانه تعیین می‌کند","لزلی را مجبور می‌کند خانهٔ دیگری به تام بفروشد"],"تقلب (fraud). و دادگاه برای مردم معاملهٔ جدید نمی‌سازد."],
p13:["پیشنهاد مناقصه (tender) در ایجاد رابطهٔ حقوقی با پیشنهاد (offer) ___ تفاوت دارد.",null,"پیشنهاد مناقصه معمولاً قابل پس گرفتن نیست."],
p14:["شرکت BuildersRUs یک پیشنهاد مناقصهٔ ممهور با سپرده (deposit) فرستاد، برنده شد، ولی نتوانست کار را انجام دهد. کدام درست است؟",["BuildersRUs باید کار را انجام دهد.","BuildersRUs می‌تواند انصراف دهد چون هنوز چیزی امضا نشده.","BuildersRUs می‌تواند انصراف دهد و سپرده‌اش را پس بگیرد.","مالک باید کار را با همان قیمت به نفر بعدی بدهد."],"غیرقابل رجوع (irrevocable). اگر امتناع کنند، سپرده را از دست می‌دهند و ممکن است از آنها شکایت شود."],
p15:["دادگاه‌ها برای تعیین قیمت quantum meruit چه چیزهایی را در نظر می‌گیرند؟ (همهٔ موارد درست)",["قیمت کالا یا خدمات مشابه در همان منطقه","«نرخ رایج» (going rate) تأمین‌کنندگان مشابه","فقط قیمتی که قبل از کار توافق شده","هر قیمتی که این شخص قبلاً گرفته"],"نه «فقط قیمتی که قبلاً توافق شده» و نه «هر قیمتی که این شخص قبلاً گرفته»."],
p16:["راه‌حل شبه‌قراردادی (quasi-contractual) که وقتی قیمتی تعیین نشده، قیمت معقولی تعیین می‌کند، چه نام دارد؟",["Quantum meruit","استاپل وعده (promissory estoppel)","Caveat emptor","Ultra vires"],"«به اندازه‌ای که استحقاق دارد.»"],
p17:["کدام یک از راه‌هایی نیست که دادگاه‌ها اثر نبودِ عوض را وقتی بدهکار کمتر از بدهی‌اش می‌پردازد، کم می‌کنند؟",["یک سند کتبی که در آن طرفین وعدهٔ پذیرفتن مبلغ کمتر را می‌نویسند","یک سند ممهور (under seal) با وعدهٔ پذیرفتن مبلغ کمتر","پرداخت با چیزی غیر از پول","پرداخت مبلغ کمتر قبل از سررسید"],"نوشتن به‌تنهایی کافی نیست. مُهر (SEAL) لازم است."],
p18:["اگر طلبکار (creditor) بپذیرد که مبلغ کمتری بگیرد، وعدهٔ او ___ و ___ است.",null,"طلبکار در ازای آن چیزی دریافت نکرد."],
p19:["طبق اصل ___ وعده (promissory)، یک وعده حتی بدون ___ قابل اجراست.",null,"وعده داد + اعتماد کرد + عمل کرد = نمی‌تواند پس بگیرد."],
p20:["فیل به گلوریا قول یک شغل تمام‌وقت داد. او شغلش را رها کرد و پیش‌پرداخت ماشین داد. بعد فیل نظرش عوض شد. گزینه‌های گلوریا چیست؟",["بهترین راه برای اجرای وعدهٔ فیل، استناد به استاپل وعده (promissory estoppel) است.","وعدهٔ فیل همیشه غیرقابل اجراست چون کتبی نبود.","گلوریا می‌تواند برای شغلی که از دست داد quantum meruit مطالبه کند.","گلوریا هیچ گزینه‌ای ندارد: او عوضی نداده است."],"نه «همیشه غیرقابل اجرا چون کتبی نبود». کلمهٔ قوی است!"],
p21:["چرا نباید صغار (minors) به وعده‌هایشان ملزم باشند؟ (همهٔ موارد درست)",["بی‌تجربگی","نابالغی","مصلحت عمومی (public policy)","والدین می‌توانند مسئول باشند"],"«والدین می‌توانند مسئول باشند» دلیل نیست."],
p22:["قانون تلاش می‌کند از منافع صغیر به‌عنوان موضوعی از ___ محافظت کند.",null,"Equity = انصاف."],
p23:["در کامن‌لا (Common Law)، افراد زیر ۲۱ سال ___ یا ___ نامیده می‌شوند.",null,"«Infant» در حقوق به معنای نوزاد نیست."],
p24:["___ فقط می‌توانند قراردادهای ___ ببندند.",null,"فقط خود صغیر می‌تواند فسخ کند."],
p25:["کدام جمله دربارهٔ صغار و قرارداد درست است؟",["صغار فقط می‌توانند قراردادهای قابل ابطال (voidable) ببندند.","صغار فقط می‌توانند قراردادهای باطل (void) ببندند.","قرارداد با صغار به‌طور کامل علیه آنها قابل اجراست.","صغار اصلاً نمی‌توانند قرارداد ببندند."],"نه باطل، نه کاملاً قابل اجرا، و صغار می‌توانند قرارداد ببندند."],
p26:["اگر قرارداد با صغیر برای یک کالای غیرضروری به‌طور کامل ___ نشده باشد، به انتخاب صغیر می‌تواند ___ باشد.",null,"معامله تمام نشده + بچه + کالای «خواستنی» = بچه می‌تواند فسخ کند."],

p31:["کدام معمولاً جزو مایحتاج ضروری (necessaries) نیست؟",["تعطیلات و سفر","لباس","خدمات پزشکی پایه","سرپناه"],"نیاز در برابر خواسته."],
p32:["بتی یک گلدان به جین (صغیر) می‌فروشد. چه زمانی قرارداد قابل ابطال است؟",["جین گلدان را برمی‌گرداند چون فهمیده همه‌جا ارزان‌تر فروخته می‌شود.","بتی قرارداد را فسخ می‌کند چون خریدار دیگری پول بیشتری پیشنهاد داده.","جین پرداخت را قطع می‌کند اما گلدان را نگه می‌دارد.","جین گلدان را می‌شکند و همهٔ پولش را پس می‌خواهد."],"فقط صغیر فسخ می‌کند، با برگرداندن کالا در وضعیت خوب."],
p33:["جیم (۱۶ ساله) یک گلدان خرید: ۵۰٪ پیش‌پرداخت + ماهی ۱۰ دلار به مدت ۶ ماه. کدام نادرست است؟",["جیم می‌تواند گلدان را به هر دلیلی برگرداند و پولی را که داده پس بگیرد، حتی اگر حالا ترک خورده باشد.","جیم می‌تواند در مدت معقول قرارداد را رد (repudiate) کند.","فقط جیم، نه فروشنده، می‌تواند قرارداد را فسخ کند.","نپرداختن ماهی ۱۰ دلار با فسخ کردن یکی نیست."],"کالای آسیب‌دیده = بازپرداخت کامل نه."],
p34:["اظهار خلاف واقع دربارهٔ سن (fraudulent misrepresentation): کدام‌ها درست‌اند؟ (همهٔ موارد درست)",["صغیر نمی‌تواند به قرارداد کالا یا خدمات غیرضروری ملزم شود","معاملات آنلاین موضوع را پیچیده‌تر می‌کنند","صغیری که بخواهد از فروشندگان سوءاستفاده کند ممکن است با اتهام کیفری روبه‌رو شود","برای خریدهای آنلاین قوانین متفاوتی وجود دارد","صغیری که دربارهٔ سنش دروغ بگوید لازم نیست بهای مایحتاج ضروری را بپردازد"],"قوانین آنلاین هم همان است. صغار همچنان مسئول مایحتاج ضروری‌اند."],
p35:["قانون تفاوت چندانی نمی‌بیند بین اینکه صغیر را ___ یا ___ بداند.",null,"فروشنده یا خریدار، بچه همچنان بچه است. (ترتیب: اول merchant.)"],
p36:["صغار در کسب‌وکار: کدام‌ها درست‌اند؟ (همهٔ موارد درست)",["قراردادی که صغیر برای خرید تجهیزات کسب‌وکار امضا کند قابل ابطال است","بزرگسال هیچ الزامی ندارد با صغیر قرارداد ببندد","صغیر را نمی‌توان مجبور به اجرای قرارداد کرد","فروشندهٔ صغیر لازم نیست سپرده را پس بدهد","صغیر همیشه می‌تواند حتی بعد از تحویل گرفتن کالا قرارداد را رد کند"],"صغیر باید سپرده را پس بدهد، و بعد از تحویل گرفتن کالا، فسخ تضمین‌شده نیست."],
p37:["به‌عنوان یک قاعدهٔ کلی، والدین ___ مسئول بدهی‌های فرزندان صغیرشان هستند.",null,"مگر: مایحتاج ضروری زیر ۱۶ سال، نمایندگی (agent)، یا امضای مشترک."],
p38:["برای کودکان زیر ۱۶ سال، والدین ___ و ___ مسئول مایحتاج ضروری‌ای هستند که فروشندگان تأمین کرده‌اند.",null,"با هم و هر کدام به‌تنهایی."],
p39:["کدام دربارهٔ رابطهٔ والدین و صغیر درست نیست؟",["مسئولیت در قبال صغار فقط از طریق کامن‌لا (Common Law) است.","والدین معمولاً مسئول بدهی‌های فرزندانشان نیستند.","والدی که امضای مشترک کند ممکن است مسئول باشد.","کودک می‌تواند به‌عنوان نمایندهٔ والد عمل کند («به حساب من بنویسید»)."],"قوانین مصوب (statutes) هم مهم‌اند. «فقط» کلمهٔ قوی است."],
p40:["اهلیت (capacity) یکی از ارکان یک ___ الزام‌آور قانونی است.",["قرارداد","دستور","فرمان","حکم"],"دستور، فرمان و حکم، فرمان هستند نه معامله."],
p41:["اصطلاح دیگر برای عدم اهلیت (incapacity):",["عدم صلاحیت (incompetence)","نابالغی (immaturity)","ورشکستگی (insolvency)","عدم واجد شرایط بودن (ineligibility)"],"اهلیت = طرفین صالح (competent parties)."],

p55:["قراردادی که به‌خاطر موضوع غیرقانونی یا غیرقانونی بودن اجرای آن کنار گذاشته شود، معمولاً چه اعلام می‌شود؟",["باطل (void)","قابل ابطال (voidable)","Void esse quam videri","معتبر اما غیرقابل اجرا"],"از ابتدا مرده است."],

v42:["لوله‌ای می‌ترکد. لوله‌کش می‌آید؛ دربارهٔ قیمت حرفی زده نمی‌شود. صورت‌حساب ۱٬۴۰۰ دلار است که خیلی زیاد است. دادگاه چه می‌کند؟",["قیمت معمول لوله‌کش‌ها (نرخ رایج) را اعمال می‌کند","۱٬۴۰۰ دلار را اجرا می‌کند","رایگان می‌کند: بدون قیمت = بدون قرارداد","هر قیمتی که این لوله‌کش قبلاً گرفته را اعمال می‌کند"],"Quantum meruit: قیمت منصفانه، نرخ رایج در منطقه."],

v46:["ماریو ۴۰٬۰۰۰ دلار به Equity Finance بدهکار است. پدرش تونی ۳۵٬۰۰۰ دلار می‌پردازد و Equity آن را می‌پذیرد. آیا Equity می‌تواند برای ۵٬۰۰۰ دلار باقی‌مانده از ماریو شکایت کند؟",["نه. شخص ثالث پرداخت کرد.","بله. وعدهٔ گرفتن مبلغ کمتر بلاعوض بود.","بله، مگر اینکه ممهور بوده باشد.","فقط اگر ماریو صغیر باشد."],"پرداخت توسط شخص ثالث یکی از ۴ راه‌حل است."],

v53:["در پروندهٔ High Trees (لرد دنینگ)، صاحبخانه در جنگ جهانی دوم اجاره را کم کرد. بعداً اجارهٔ کامل آن دوره را خواست. نتیجه؟",["نتوانست آن را بگیرد","همه را گرفت","نصفش را گرفت","اجاره‌نامه باطل بود"],"استاپل وعده."],

v60:["یک نوجوان ۱۵ ساله می‌گوید «۲۰ سالمه» و آنلاین یک گوشی می‌خرد. کدام درست است؟",["هنوز می‌تواند لغو کند، اما ممکن است با اتهام تقلب روبه‌رو شود","نمی‌تواند لغو کند چون دروغ گفت","قوانین آنلاین متفاوت است، پس ملزم است","والدینش باید بپردازند"],"قوانین آنلاین همان است. دروغ برای فریب فروشنده می‌تواند جرم باشد."],
v61:["یک نوجوان ۱۵ ساله دوچرخه می‌فروشد و ۵۰ دلار سپرده از شما گرفته. او فروش را لغو می‌کند. سپرده چه می‌شود؟",["باید آن را پس بدهد","آن را نگه می‌دارد","نصفش برمی‌گردد","والدینش آن را نگه می‌دارند"],"صغیر نمی‌تواند پول شما را نگه دارد."],

function relayConnect(url, opts={}){
  return new Promise((resolve, reject) => {

const WT = (() => {
  try {
    const src = "const t={};onmessage=e=>{const [op,id,ms]=e.data;if(op==='s'){t[id]=setTimeout(()=>{postMessage(id);delete t[id]},ms)}else if(op==='i'){t[id]=setInterval(()=>postMessage(id),ms)}else{clearTimeout(t[id]);clearInterval(t[id]);delete t[id]}}";
    const w = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    const cbs = {}; let n = 0;
    w.onmessage = e => { const f = cbs[e.data]; if (f) f(); };
    return { set(fn, ms){ const id = ++n; cbs[id] = () => { delete cbs[id]; fn(); }; w.postMessage(["s", id, ms]); return id; },
             every(fn, ms){ const id = ++n; cbs[id] = fn; w.postMessage(["i", id, ms]); return id; },
             clear(id){ if (id == null) return; delete cbs[id]; w.postMessage(["c", id]); } };
  } catch(e) { return { set:(f,ms)=>setTimeout(f,ms), every:(f,ms)=>setInterval(f,ms), clear:id=>{ clearTimeout(id); clearInterval(id); } }; }
})();

function pickQs(n, topic){
  const pool = shuffle(Q.filter(q => topic === "all" || q.t === topic).map(asMC).filter(q => q.type === "mc" || q.type === "tf"));
  return (n ? pool.slice(0, n) : pool).map(q => {

  else if (P.status === "nogame" || P.status === "error") body = `<div class="stack center"><div class="err">${esc(P.err)}</div><div class="row" style="justify-content:center"><button class="btn primary" id="pRetry">Try again</button><button class="btn ghost" id="pBack">Change code</button></div></div>`;
  else if (P.status === "hostgone") body = `<div class="stack center"><h2>The host ended this game</h2><button class="btn primary" id="pBack">Back</button></div>`;
  else if (!st || st.phase === "lobby") body = `<div class="stack center"><span class="eyebrow">Game ${esc(P.code)}</span><h2>${ui(LANG,"You're in","youreIn")}, ${esc(P.name)}</h2><p class="muted">${ui(LANG,"Waiting for the host to start.","waitHost")}${st&&st.players?` ${st.players.length} ${st.players.length===1?"player":"players"} so far.`:""}</p></div>`;
  else if (st.phase === "question") {
    const sq = shownQ(st);
    const locked = P.picked !== null;
    const solved = P.picked === -1 && sq;
    body = `<div class="qhead"><span class="mono muted">${st.qi+1} / ${st.total}${st.rep?` · ${ui(LANG,"Back again","backAgain")}`:""}</span>${st.dur?`<span class="score" id="lsecs">${st.dur}</span>`:`<span class="mono muted">${ui(LANG,"No time limit","noLimit")}</span>`}</div>
      ${st.dur?`<div class="timer"><i id="ltimer"></i></div>`:""}${questionHTML(st, sq)}
      <div class="kgrid">${st.q.o.map((o,n)=>btnK(n,optLabel(sq,o), solved?(n===sq.a?"win":"dim"):locked?(P.picked===n?"win":"dim"):"", locked)).join("")}</div>
      ${solved?whyHTML(sq, sq.why):""}
      ${locked?`<p class="muted" style="text-align:center">${solved?ui(LANG,"You saw the answer (0 points).","solved")+" ":""}${st.answered ? "✓ "+ui(LANG,"Answer locked in. Waiting for everyone…","locked") : ui(LANG,"Sending your answer…","sending")}</p>`:`<div class="row" style="justify-content:center"><button class="btn ghost" id="pSolve">${ui(LANG,"Solve (0 points)","solve")}</button></div>`}`;
  } else if (st.phase === "reveal" || st.phase === "last") {
    const y = st.you || {}; const sq = shownQ(st);
    const head = y.ok ? `${ui(LANG,"Correct","correct")}<span class="gain">+${y.gain}</span>` : y.solved ? ui(LANG,"You saw the answer","solved") : y.answered ? ui(LANG,"Not this time","notThis") : ui(LANG,"Too slow","tooSlow");
    body = `<div class="stack center"><div class="result ${y.ok?"good":"bad"}">${head}</div>
      <p><b>${ui(LANG,"Answer:","answerC")}</b> ${optLabel(sq, st.q.o[st.c])}</p>${whyHTML(sq, st.why)}
      ${st.back?`<p class="note">${ui(LANG,"This question will come back later.","comeBack")}</p>`:""}
      <p class="score">${y.pts||0} pts</p><p class="muted">${rankLine(y.rank||"–", st.n)}</p><p class="muted" style="font-size:.85rem">${ui(LANG,"Waiting for the next question…","waitNext")}</p></div>`;
  } else {
    const y = st.you || {};
    body = `<p class="score" style="text-align:center">You finished #${y.rank||"–"} with ${y.pts||0} pts</p>` + podiumHTML(st.board || [], P.name);
  }
  if (P.status === "reconnecting") body = `<p class="note" style="text-align:center">Reconnecting… your score is safe.</p>` + body;
  if (P.lat != null && P.status !== "error" && P.status !== "nogame") body += `<p id="lat" class="lat ${latClass(P.lat)}">Connection: ${P.lat} ms</p>`;
  main.innerHTML = `<div class="panel stack">${body}<div class="row" style="justify-content:center"><button class="btn ghost" id="pLeave" style="font-size:.88rem">Leave game</button></div></div>`;
  root.querySelectorAll(".kbtn[data-n]").forEach(b => b.onclick = () => pick(+b.dataset.n));
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#pSolve", () => pick(-1));
  on("#pRetry", () => join(P.code, P.name));
  on("#pBack", () => { endSession(); home(); });
  on("#pLeave", () => { endSession(); home(); });
  paintTimer();
}
draw();
})();</script></body></html>
